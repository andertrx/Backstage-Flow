# Servidor de conexão do WhatsApp (Evolution API) para o Backstage Flow.
# Sobe 4 programas: Caddy (endereço seguro https com certificado automático), Evolution API, Postgres e Redis.
# Só as portas 80 e 443 ficam abertas para a internet; a porta do Evolution NÃO é exposta.
# Este arquivo foi montado a partir do repositório aberto do Evolution API (imagem e nomes das variáveis conferidos lá);
# o primeiro teste real é no seu servidor. Se algo não subir, mande a mensagem de erro que eu ajusto.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    expose:
      - "8080"
    volumes:
      - evolution_instances:/evolution/instances
    environment:
      SERVER_URL: https://${DOMAIN}
      SERVER_PORT: "8080"
      # Chave de acesso: é a que você cola no CRM (Configurações → Integrações).
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution_db?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: backstage
      # Privacidade: guarda só a sessão do WhatsApp. NÃO guarda mensagens, contatos, conversas nem histórico.
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      DATABASE_SAVE_IS_ON_WHATSAPP: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_LOCAL_ENABLED: "false"
      # Nenhum aviso de mensagem recebida é enviado para lugar nenhum.
      WEBHOOK_GLOBAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: "30"
      DEL_INSTANCE: "false"

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  caddy_data:
  caddy_config:
  evolution_instances:
  postgres_data:
  redis_data:
